         to ensure the 3D canvas also clears to this exact colour. */

        background: #01020a !important;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        background: #01020a !important;
        height: 100%;
        display: flex;
        flex: 1;
      }
      canvas {
        background: #01020a !important;
        display: block !important;
      }
    </style>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
